services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-tup}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tup} -d ${POSTGRES_DB:-tup}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tup}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-tup}
      REDIS_URL: redis://redis:6379/0
      SESSION_DIR: /data/session
      CACHE_DIR: /data/cache
      SPOOL_DIR: /data/spool
    volumes:
      - tgsession:/data/session
      - filecache:/data/cache
      - spool:/data/spool
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  collabora:
    # CODE 26.04 runs `coolwsd --use-env-vars`, which ignores extra_params —
    # configuration lives in the mounted coolwsd.xml (ssl off, proxy
    # server_name, WOPI allowlist). The image ships no shell, so no healthcheck.
    image: collabora/code:latest
    environment:
      - DONT_GEN_SSL_CERT=1
      - aliasgroup1=http://backend:8000
    volumes:
      - ./collabora/coolwsd.xml:/etc/coolwsd/coolwsd.xml:ro
    cap_add:
      - MKNOD
    restart: unless-stopped

  opencad:
    # Prebuilt image: the wasm build is heavy (iced + wgpu + CAD parser), so it
    # is compiled on a beefier host via ./opencad/Dockerfile and loaded here as
    # `opencad-wopi`. To rebuild it, run `docker build -t opencad-wopi ./opencad`
    # on a machine with adequate RAM. `pull_policy: never` keeps compose from
    # trying to fetch it from a registry.
    image: opencad-wopi
    pull_policy: never
    restart: unless-stopped

  signex:
    # Prebuilt image, same model as opencad: the wasm build (iced + wgpu +
    # 17-crate EDA workspace) is compiled on a beefier host via
    # ./signex/Dockerfile and loaded here as `signex-wopi`. To rebuild:
    # `docker build -t signex-wopi ./signex` on a machine with adequate RAM.
    image: signex-wopi
    pull_policy: never
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${TUP_CLOUD_PORT:-8080}:80"
    depends_on:
      - backend
      - collabora
      - opencad
      - signex

volumes:
  pgdata:
  redisdata:
  tgsession:
  filecache:
  spool:
