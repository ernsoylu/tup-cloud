# Upgrade the connection only when the client actually requests a websocket;
# Collabora's download/convert requests on /cool/... are plain HTTP and break
# if "Connection: upgrade" is forced on them.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    client_max_body_size 2100m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # --- Collabora Online (CODE), per the reference proxy layout ---

    # Static browser bundle and WOPI discovery.
    location ^~ /browser {
        proxy_pass http://collabora:9980;
        proxy_set_header Host $http_host;
    }

    location ^~ /hosting {
        proxy_pass http://collabora:9980;
        proxy_set_header Host $http_host;
    }

    # Admin console websocket.
    location ^~ /cool/adminws {
        proxy_pass http://collabora:9980;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 36000s;
    }

    # Main editing websocket (CODE 26 route: WOPISrc travels in the query).
    location = /cool/ws {
        proxy_pass http://collabora:9980;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 36000s;
    }

    # Legacy per-document editing websocket.
    location ~ ^/cool/(?:.*)/ws$ {
        proxy_pass http://collabora:9980;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 36000s;
    }

    # Everything else under /cool: downloads (Export As), convert-to, etc.
    location ~ ^/cool {
        proxy_pass http://collabora:9980;
        proxy_set_header Host $http_host;
        proxy_read_timeout 36000s;
    }

    # Hashed bundles are immutable — cache them hard.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must always be revalidated so new deploys show up immediately.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
